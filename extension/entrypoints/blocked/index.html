<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay focused — FocusFlow</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
        padding: 2rem;
        max-width: 28rem;
      }
      .tomato {
        font-size: 4rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0.5rem 0;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
      .pill {
        display: inline-block;
        margin-top: 1rem;
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #64748b;
        border: 1px solid #334155;
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="tomato">🍅</div>
      <h1>Stay focused.</h1>
      <p>
        This site is blocked while you're in a focus session. Get back to deep
        work — it'll still be here when your break starts.
      </p>
      <span class="pill">FocusFlow · Focus mode active</span>
    </div>
  </body>
</html>
