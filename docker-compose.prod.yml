# Production composition. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy is exposed to the host (80/443). All other services talk over the
# internal Docker network and are reachable by their service name.

services:
  db:
    image: postgres:15-alpine
    container_name: pomodoro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pomodoro-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  stats-service:
    build: ./stats-service
    container_name: pomodoro-stats
    restart: unless-stopped
    environment:
      # No ?schema=public here: that is a Prisma-specific param the pgx driver rejects.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  frontend:
    build: ./frontend
    container_name: pomodoro-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
    depends_on:
      - backend
      - stats-service
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: pomodoro-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - stats-service

volumes:
  pg_data:
  caddy_data:
  caddy_config:
